<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SportPharm — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E0312A;--red-d:#b8261f;--navy:#0B1E3B;--navy-2:#12294a;--navy-3:#1c3a63;
  --ink:#10233f;--muted:#6b7a90;--line:#e4e9f0;--bg:#f3f6fb;--card:#fff;--soft:#eef3f9;
  --green:#12925a;--green-bg:#e5f4ec;--amber:#c07806;--amber-bg:#fbf1de;--blue:#2563eb;--blue-bg:#e6edfd;--gray-bg:#eef1f6;
  --sh:0 1px 2px rgba(16,35,63,.06),0 8px 24px -16px rgba(16,35,63,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Inter",sans-serif}
.disp{font-family:"Bebas Neue",sans-serif;letter-spacing:.02em;font-weight:400}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::placeholder{color:#9aa7b8}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 120% at 80% 0%,#1c3a63 0%,transparent 60%),linear-gradient(150deg,#0a1a33,#12294a 60%,#0a1a33)}
.login-card{background:var(--card);border-radius:18px;padding:40px 38px 34px;width:100%;max-width:400px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);text-align:center}
.login-card img{height:30px;margin-bottom:6px}
.login-card .lc-sub{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:22px}
.login-card h1{font-size:22px;margin-bottom:4px;color:var(--ink)}
.login-card p.mut{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.fld{text-align:left;margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.fld input:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(28,58,99,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px;transition:.15s}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-primary{background:var(--red);color:#fff;width:100%}
.btn-primary:hover{background:var(--red-d)}
.login-note{margin-top:16px;font-size:12px;color:#93a0b2}

/* ---------- APP SHELL ---------- */
#app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#cdd8e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-top{padding:22px 20px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-top img{height:24px}
.sb-badge{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(224,49,42,.16);color:#ff9a94;padding:4px 7px;border-radius:6px}
.sb-nav{padding:14px 12px;flex:1;overflow:auto}
.sb-lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5d708a;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;font-size:14px;font-weight:500;color:#c4d0e2;cursor:pointer;transition:.13s;width:100%;text-align:left}
.sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.on{background:var(--red);color:#fff}
.sb-item.on svg{opacity:1}
.sb-item .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:20px}
.sb-item.on .cnt{background:rgba(255,255,255,.22)}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--red),#ff6b52);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px}
.sb-foot .who{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.sb-foot .who small{display:block;font-size:11px;font-weight:500;color:#8a99b0}
.sb-foot .out{margin-left:auto;color:#8a99b0}
.sb-foot .out:hover{color:#fff}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:0 28px;height:66px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20}
.topbar .tt{font-family:"Bebas Neue",sans-serif;font-size:27px;letter-spacing:.02em;line-height:1}
.topbar .search{margin-left:auto;position:relative}
.topbar .search input{width:260px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.topbar .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#93a0b2}
.topbar .view-site{font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.topbar .view-site:hover{color:var(--red)}
.content{padding:26px 28px 60px;max-width:1240px;width:100%}

/* ---------- UI PRIMITIVES ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pagehead .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-ghost:hover{border-color:#c7d2e0;background:var(--soft)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.pad{padding:20px 22px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:var(--sh)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi .k-ico svg{width:17px;height:17px}
.kpi .k-val{font-family:"Bebas Neue",sans-serif;font-size:38px;line-height:.95;margin-top:12px}
.kpi .k-lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.kpi .k-trend{font-size:11.5px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--green)}.down{color:var(--red)}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:14px;font-weight:700}
.sec-h a{font-size:12.5px;font-weight:600;color:var(--red)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover,.tbl tbody tr:hover{background:var(--soft)}
.t-title{font-weight:600;color:var(--ink)}
.t-sub{font-size:12px;color:var(--muted)}
.rowimg{width:44px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0}
.cellflex{display:flex;align-items:center;gap:11px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-blue{background:var(--blue-bg);color:var(--blue)}
.p-gray{background:var(--gray-bg);color:#5b6b82}
.p-red{background:#fbe7e6;color:var(--red-d)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--soft);color:#4f6079;padding:2px 8px;border-radius:6px;margin:2px 3px 2px 0}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.chipf{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.chipf.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.iconbtn{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.act-del:hover{color:var(--red);background:#fbe7e6}

/* editor */
.editor{display:grid;grid-template-columns:1fr 340px;gap:18px}
.f-group{margin-bottom:16px}
.f-group label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.f-group .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}
.inp:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(28,58,99,.1)}
textarea.inp{resize:vertical;min-height:260px;line-height:1.6;font-size:14px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}
.tagbox input{border:0;background:none;flex:1;min-width:90px;padding:4px}
.tagbox input:focus{outline:none}
.tagchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--navy);color:#fff;padding:3px 5px 3px 9px;border-radius:6px}
.tagchip b{cursor:pointer;font-weight:700;opacity:.7}.tagchip b:hover{opacity:1}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.side-card h4{font-size:12.5px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.imgprev{width:100%;aspect-ratio:16/9;border-radius:9px;object-fit:cover;background:var(--soft);border:1px dashed var(--line);margin-bottom:10px;display:block}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.pub{color:var(--green)}

/* modal + drawer */
#modal:empty,#drawer:empty{display:none}
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,22,40,.5);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.drawer-ov{position:fixed;inset:0;z-index:60;background:rgba(10,22,40,.5);display:flex;justify-content:flex-end}
.drawer{background:#fff;width:100%;max-width:440px;height:100%;overflow:auto;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px}
.mb{padding:20px 22px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 20px 40px -12px rgba(0,0,0,.4);opacity:0;transition:.22s;pointer-events:none;display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:16px;height:16px;color:#5be59a}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.minichart{display:flex;align-items:flex-end;gap:5px;height:46px}
.minibar{flex:1;background:var(--soft);border-radius:3px 3px 0 0;position:relative}
.minibar i{position:absolute;inset:auto 0 0 0;background:var(--red);border-radius:3px 3px 0 0;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px}
.barlist{display:flex;flex-direction:column;gap:13px}
.barrow{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:12px;font-size:13px}
.barrow .track{height:8px;background:var(--soft);border-radius:5px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--red));border-radius:5px}
.barrow .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.funnel-row{margin-bottom:17px}
.funnel-lbl{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.funnel-lbl b{font-size:16px;font-variant-numeric:tabular-nums}
.funnel-bar{height:26px;background:var(--soft);border-radius:7px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));border-radius:7px;transition:width .6s ease}
.funnel-drop{margin-top:5px;font-size:11px;color:var(--amber);font-weight:700}
.prod-atc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.prod-atc b{display:block;font-size:27px;font-family:"Bebas Neue",sans-serif;line-height:1}
.prod-atc span{display:block;margin-top:4px;font-size:10.5px;color:var(--muted);line-height:1.35}
.feed{display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);list-style:none;font-size:13px}
.feed li:last-child{border:0}
.feed .fi{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.feed .fi svg{width:15px;height:15px}
.feed time{color:var(--muted);font-size:11.5px}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.editor{grid-template-columns:1fr}.editor{display:block}}
@media(max-width:820px){#app{grid-template-columns:1fr}.sidebar{display:none}.grid2b{grid-template-columns:1fr}.topbar .search input{width:150px}}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><meta name="theme-color" content="#15202b"></head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <img src="assets/wordmark-dark.png" alt="SportPharm">
    <div class="lc-sub">Admin Console</div>
    <h1>Sign in</h1>
    <p class="mut">Manage content, products, leads &amp; insights.</p>
    <form id="loginForm">
      <div class="fld"><label>Email</label><input type="email" value="brandon@sportpharm.com" required></div>
      <div class="fld"><label>Password</label><input type="password" value="demo" required></div>
      <button class="btn btn-primary" type="submit">Sign in to dashboard</button>
    </form>
    <div class="login-note">Prototype — any credentials work.</div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="sb-top"><img src="assets/wordmark-white.png" alt="SportPharm"><span class="sb-badge">Admin</span></div>
    <nav class="sb-nav" id="sbnav"></nav>
    <div class="sb-foot">
      <div class="avatar">BW</div>
      <div class="who">Brandon Welch<small>President</small></div>
      <button class="out" id="logout" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="tt" id="ptitle">Dashboard</div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="globalsearch" placeholder="Search content, leads…"></div>
      <a class="view-site" href="index.html" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>View site</a>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modal"></div>
<div id="drawer"></div>
<div id="toast"></div>

<script src="assets/track.js"></script>
<script>
/* ============ ICONS ============ */

  "image": "assets/ea-recovery.jpg",
  "excerpt": "You finish a workout feeling accomplished. Then the next morning, getting out of bed feels like its own training session.",
  "body": "You finish a workout feeling accomplished. Then the next morning, getting out of bed feels like its own training session.\n\nMuscle soreness after a new or demanding workout can be a normal response to exercise. But pain is information, and not every ache should be treated as proof that the workout “worked.” The useful question is not simply **“Does it hurt?”** It is **“How does it hurt, when did it begin, and what is it doing over time?”**\n\nThis guide can help you organize those clues. It cannot tell you whether you have an injury.\n\n## What normal soreness often feels like\n\nCommon post-workout soreness is usually felt in the muscles you trained. It may feel like tenderness, stiffness, heaviness, or a broad ache on both sides of the body. It often becomes noticeable after the workout rather than during one exact movement.\n\nNormal soreness should remain manageable. You may move a little stiffly, but you can generally complete ordinary daily activities. Most importantly, the overall trend should move in the right direction.\n\nAsk yourself:\n\n- Is the sensation spread through a muscle rather than concentrated in one precise spot?\n- Did it appear after an unfamiliar exercise, a harder session, or a return after time away?\n- Does gentle movement help you loosen up?\n- Is it gradually improving rather than becoming sharper or more limiting?\n\nNo single answer proves that the sensation is harmless. Together, however, these details create a more useful picture than a pain score alone.\n\n## Signs that deserve more caution\n\nPause the workout and consider professional guidance when pain is sharp, sudden, highly localized, or associated with a specific incident. Swelling, significant bruising, weakness, numbness, tingling, a joint that gives way, or an inability to use the area normally are also reasons not to “test it” with another hard session.\n\nPain that worsens with each workout, changes your gait or technique, wakes you at night, or keeps returning in the same place deserves attention. Frequent pain associated with activity can sometimes represent an overuse problem rather than ordinary soreness.\n\nSeek urgent care for a serious deformity, inability to bear weight after an injury, loss of feeling or movement, severe unexplained weakness, chest pain, trouble breathing, or concerning symptoms after a head impact.\n\n## What to do today\n\nIf the sensation seems consistent with ordinary soreness and no warning signs are present:\n\n1. **Reduce the demand.** Choose an easier session, train a different area, or take a recovery day.\n2. **Keep movement comfortable.** Gentle walking or easy mobility may feel better than complete inactivity.\n3. **Watch the trend.** Note whether function and comfort improve over the next few days.\n4. **Review the trigger.** A sudden jump in weight, volume, intensity, frequency, terrain, or a new exercise may explain why this session hit differently.\n5. **Do not use pain relief to override a warning signal.** If you need medication simply to complete the planned workout, reconsider the workout first.\n\n## The next-workout check\n\nBefore you train again, try the movement at low effort. Can you move through the normal pattern without sharp pain, compensation, or increasing symptoms? If not, change the plan.\n\nThe goal is not to prove toughness. It is to preserve enough capacity to train consistently.\n\n### Bottom line\n\nBroad, manageable muscle soreness that follows an unfamiliar workload and steadily improves is different from pain that is sharp, localized, worsening, or function-limiting. When the pattern is unclear, the safer move is to reduce the load and reassess—not force the original plan.\n\n### Continue your pathway\n\n- Pain keeps returning? Read **Why Does the Same Pain Keep Coming Back?**\n- Deciding about today’s session? Read **Should I Work Out When Something Hurts?**\n- Symptoms are limiting normal activity? Read **When Is It Time to Get an Injury Checked?**\n\n## FAQ\n\n### Is it normal to be sore two days after a workout?\n\nSoreness can be delayed after a new or demanding session. What matters is the full pattern: the sensation should be manageable and should begin improving. Sharp, worsening, highly localized, or function-limiting pain deserves more caution.\n\n### Should I stretch sore muscles?\n\nGentle, comfortable mobility may help you feel less stiff. Avoid forcing a deep stretch into pain, particularly if you suspect a strain or another injury.\n\n### Can I work out when I am sore?\n\nSometimes. Consider reducing intensity, shortening the session, or training a different area. Stop if pain becomes sharp, your movement changes, or symptoms increase.\n\n### Editorial sources\n\n- [MedlinePlus: How to avoid exercise injuries](https://medlineplus.gov/ency/patientinstructions/000859.htm)\n- [AAOS: Hip Strains](https://orthoinfo.aaos.org/diseases--conditions/hip-strains/)\n- [MedlinePlus: Muscle Aches](https://medlineplus.gov/ency/article/003178.htm)\n\n---"

  "image": "assets/ea-runner.jpg",
  "excerpt": "You rest until it feels better. You return to your normal routine. A few workouts later, the same pain is back.",
  "body": "You rest until it feels better. You return to your normal routine. A few workouts later, the same pain is back.\n\nRecurring pain can feel unpredictable, but the pattern often contains useful clues. Rest may calm symptoms without changing the workload, movement, recovery, equipment, or health factor that helped create the problem. When the original demand returns, the symptoms may return with it.\n\nThat does not mean you should diagnose yourself. It means the cycle is worth examining.\n\n## Relief is not always resolution\n\nFeeling better during a break tells you that reducing the demand helped. It does not necessarily tell you why the area became irritated or whether it is ready for the exact same workload.\n\nRecurring symptoms can be influenced by:\n\n- increasing training volume or intensity too quickly;\n- repeating one movement without enough variation or recovery;\n- returning at full speed after time away;\n- technique that changes under fatigue;\n- footwear, equipment, playing surface, or bike setup;\n- limited strength, mobility, or control for the task;\n- a previous injury that never fully regained capacity;\n- sleep, stress, nutrition, medications, or an underlying health issue.\n\nSeveral factors can be present at once. Generic advice often misses this because the same location can hurt for different reasons in different people.\n\n## Track the pattern, not just the pain score\n\nFor one to two weeks, record:\n\n- the exact location and type of sensation;\n- when it begins—during warm-up, at a certain distance or weight, after training, or the next day;\n- which movements increase or decrease it;\n- recent changes in volume, load, pace, frequency, terrain, or equipment;\n- whether it changes how you walk, lift, pedal, throw, or sleep;\n- how long it takes to settle.\n\nThis is not a self-diagnosis. It is useful context for deciding whether your plan needs to change and for helping a clinician understand the issue.\n\n## Break the repeat-and-rest cycle\n\nA better return is usually graduated. Start below the level that reliably provokes the problem. Change one training variable at a time, then observe the response during the session and afterward.\n\nFor example, a runner might reduce distance while keeping the route easy. A lifter might reduce load and range of motion before adding weight again. A pickleball player might shorten play time before returning to multiple consecutive games.\n\nIf symptoms return, do not keep escalating. Step back to an easier level that does not increase them. Repeatedly pushing to the same flare point gives you the same information at a higher cost.\n\n## When recurring pain should be evaluated\n\nSchedule an assessment when the pain:\n\n- keeps returning despite reasonable changes;\n- appears earlier or at lower effort;\n- becomes more intense or more localized;\n- causes weakness, instability, numbness, or tingling;\n- affects walking, sleep, work, or other daily activity;\n- follows a significant injury;\n- requires frequent medication in order to stay active.\n\nDepending on the issue and your access, a primary-care clinician, sports-medicine clinician, physical therapist, or athletic trainer may be an appropriate starting point. A pharmacist can help review whether a medicine or supplement affects symptoms, recovery, or the safe use of pain relievers.\n\n### Bottom line\n\nRecurring pain is not a character flaw and rest is not a complete investigation. Look for the repeatable relationship between symptoms and workload, then rebuild gradually. If the pattern persists or function is declining, get it assessed.\n\n### Continue your pathway\n\n- Need a lower-demand option? Read **What Does Modifying a Workout Look Like?**\n- Unsure about today’s workout? Read **Should I Work Out When Something Hurts?**\n- Ready for professional help? Read **When Is It Time to Get an Injury Checked?**\n\n## FAQ\n\n### Why does pain go away with rest and return with exercise?\n\nRest reduces demand on the area, which can reduce symptoms. If the original workload or contributing factor has not changed, symptoms may return when that demand returns.\n\n### Does recurring pain always mean an injury?\n\nNo. Recurring pain has many possible causes and cannot be classified from one symptom alone. A repeated or worsening pattern is a reason to adjust training and consider an assessment.\n\n### Who should I see for recurring workout pain?\n\nThe best entry point depends on the problem and your access. Primary care, sports medicine, physical therapy, and athletic training can all be appropriate. Urgent or severe symptoms require more immediate care.\n\n### Editorial sources\n\n- [AAOS: Shin Splints](https://orthoinfo.aaos.org/en/diseases--conditions/shin-splints/)\n- [AAOS: Hip Strains](https://orthoinfo.aaos.org/diseases--conditions/hip-strains/)\n- [MedlinePlus: How to avoid exercise injuries](https://medlineplus.gov/ency/patientinstructions/000859.htm)\n\n---"

  "excerpt": "The workout is on your calendar. Your motivation is there. One body part, however, is sending a different message.",
  "body": "The workout is on your calendar. Your motivation is there. One body part, however, is sending a different message.\n\nThere is no universal pain score that makes the decision for you. A better approach is to consider the sensation, your function, the activity, and the consequences of being wrong.\n\n## Stop now when the risk is clear\n\nEnd the session and seek appropriate care when pain follows a serious injury or comes with a visible deformity, inability to bear weight, loss of movement or feeling, severe swelling, chest pain, trouble breathing, fainting, or profound weakness.\n\nAfter a bump, blow, or jolt to the head, stop sports participation if a concussion is possible. Worsening headache, repeated vomiting, seizure, unusual confusion, slurred speech, weakness or numbness, decreased coordination, unequal pupils, or difficulty waking require emergency evaluation.\n\nDo not “finish the set” to gather more evidence.\n\n## Modify when the signal is uncertain\n\nIf there are no urgent warning signs, ask:\n\n- Is the discomfort mild and stable, or sharp and increasing?\n- Can I perform the movement normally, without limping, bracing, twisting, or shifting the load?\n- Does an easier version feel meaningfully better?\n- Is this new, or is it the return of a repeated problem?\n- Would continuing make a fall, dropped weight, collision, or loss of control more likely?\n\nIf the answers are unclear, lower the stakes. Reduce the load, range, speed, duration, or impact. Substitute a comfortable movement or train another area. Reassess after the warm-up and again after the session.\n\nStop if symptoms intensify, become sharp, spread, or change your mechanics.\n\n## Continuing should be a decision—not a default\n\nMild stiffness that improves as you warm up is a different scenario from pain that increases with every repetition. Even when continuing is reasonable, the workout may need to become a test of tolerance rather than a performance day.\n\nUse three checkpoints:\n\n1. **During:** Symptoms remain mild and movement remains normal.\n2. **Immediately after:** The area has not become notably worse.\n3. **Later and the next day:** Symptoms return to baseline rather than escalating.\n\nIf a modified session repeatedly fails one of those checks, the plan needs more than determination.\n\n## Pain relief is not one size fits all\n\nPain-relief products may have a role for some people, but relief does not establish that an activity is safe. Oral medicines and topical products differ in ingredients, precautions, and appropriate use.\n\nRead the Drug Facts label and do not combine products with the same active ingredient. Certain health conditions and other medicines can change what is safe. A pharmacist can help you compare options and identify interactions.\n\nFor localized muscle aches or soreness, some athletes may consider a topical option such as WasabiRub. Use it only as directed, avoid broken or irritated skin, and stop if a reaction occurs. Do not apply a topical product to numb a warning sign so you can force a workout.\n\n**Suggested product CTA:** Explore WasabiRub and read the full label.\n\n### Bottom line\n\nWhen the signal is mild and stable, an easier version of the workout may be reasonable. When pain is sharp, worsening, destabilizing, or changing the way you move, stop. When the consequences of guessing are high, get qualified help.\n\n### Continue your pathway\n\n- Need concrete substitutions? Read **What Does Modifying a Workout Look Like?**\n- Pain is recurring? Read **Why Does the Same Pain Keep Coming Back?**\n- Unsure who to contact? Read **When Is It Time to Get an Injury Checked?**\n\n## FAQ\n\n### Is it okay to exercise with mild pain?\n\nSometimes, but “mild” is only one factor. The sensation should not worsen, alter your movement, or create additional risk. When in doubt, reduce the demand and monitor the response.\n\n### Should I take a pain reliever before working out?\n\nDo not use pain relief simply to hide symptoms and complete a workout. Ask a pharmacist or healthcare professional whether a product is appropriate for you, and always follow the label.\n\n### What pain means I should stop exercising?\n\nStop for sharp or rapidly worsening pain, loss of normal function, weakness, instability, numbness, concerning symptoms after a head impact, or any emergency warning sign.\n\n### Editorial sources\n\n- [MedlinePlus: How to avoid exercise injuries](https://medlineplus.gov/ency/patientinstructions/000859.htm)\n- [CDC HEADS UP: Responding to a Sports-related Concussion](https://www.cdc.gov/heads-up/response/index.html)\n- [CDC HEADS UP: Concussion Signs and Symptoms](https://www.cdc.gov/heads-up/signs-symptoms/index.html)\n- [FDA: Using OTC pain relievers safely](https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/best-way-take-your-over-counter-pain-reliever-seriously-four-panel-brochure)\n\n---"

  "image": "assets/ea-pilates.jpg",
  "excerpt": "Athletes are taught to tolerate effort. That skill can help during the final climb, the last mile, or the last repetition. It becomes less useful when every signal is treated as an",
  "body": "Athletes are taught to tolerate effort. That skill can help during the final climb, the last mile, or the last repetition. It becomes less useful when every signal is treated as an obstacle to ignore.\n\nEffort and pain are not interchangeable. Neither are toughness and recovery.\n\n## The problem with “no pain, no gain”\n\nHard exercise can create burning muscles, heavy breathing, fatigue, and temporary discomfort. Those sensations are connected to exertion and usually settle when the effort ends.\n\nAn injury warning can feel different: sharp, sudden, localized, unstable, or progressively worse. It may change how you move or continue after the session. The line is not always obvious, which is precisely why “always push through” is a poor rule.\n\nIt replaces observation with identity. Instead of asking what the body needs, the athlete asks whether stopping makes them weak.\n\n## Pushing through can hide the pattern\n\nPain often changes movement before it stops movement. You shorten a stride, shift a squat, protect one shoulder, or ask another area to take more load. The workout may technically continue, but it is no longer the workout you planned.\n\nPain relievers can also change what you feel without changing what the tissue can tolerate. That does not make all pain relief inappropriate. It means symptom relief and readiness to train are separate decisions.\n\n## Recovery is an active process\n\nA recovery plan answers four questions:\n\n1. **What currently increases the symptoms?**\n2. **What activity can I do without making the pattern worse?**\n3. **How will I rebuild the missing capacity?**\n4. **What signs tell me to progress, hold, or get help?**\n\nThat plan may include temporary load reduction, movement substitutions, sleep and nutrition priorities, progressive strengthening, technique changes, or professional assessment. It should evolve according to response rather than a fixed date or a motivational slogan.\n\n## Consistency sometimes means changing the session\n\nEveryday athletes often fear that one modified workout will erase their progress. In reality, sustainable training depends on making good decisions repeatedly.\n\nExamples of productive changes include:\n\n- replacing hard intervals with easy cycling;\n- using a supported variation instead of an unstable one;\n- reducing weight and slowing the movement;\n- cutting the session before form deteriorates;\n- training a different area;\n- taking a recovery day and scheduling an assessment.\n\nThese are not automatic treatments for an injury. They are ways to reduce unnecessary exposure while you decide what the problem needs.\n\n## Replace the slogan\n\nTry this instead:\n\n**Do not prove that you can tolerate today’s pain at the expense of tomorrow’s options.**\n\nAthletic confidence does not come only from completing the original plan. It also comes from knowing how to adapt without abandoning your goals.\n\n### Bottom line\n\nPushing through is a performance tactic, not a recovery strategy. When pain is changing, recurring, or altering movement, the productive choice is to reduce uncertainty: modify the demand, monitor the response, and involve the right professional when needed.\n\n### Continue your pathway\n\n- Make today’s plan safer with **What Does Modifying a Workout Look Like?**\n- Understand a repeat pattern with **Why Does the Same Pain Keep Coming Back?**\n- Decide whether to seek care with **When Is It Time to Get an Injury Checked?**\n\n## FAQ\n\n### Is “no pain, no gain” good advice?\n\nNo. Challenging exercise can be uncomfortable, but pain during exercise can be a reason to stop or modify. A slogan cannot distinguish exertion from a warning sign.\n\n### Will taking a few days off ruin my progress?\n\nA short adjustment is unlikely to erase long-term fitness. The appropriate amount of rest or modification depends on the situation, and persistent or significant symptoms should be assessed.\n\n### How do athletes stay consistent while recovering?\n\nThey define consistency more broadly: maintaining safe activity where possible, addressing contributing factors, and rebuilding capacity progressively instead of repeatedly provoking the same symptoms.\n\n### Editorial sources\n\n- [MedlinePlus: How to avoid exercise injuries](https://medlineplus.gov/ency/patientinstructions/000859.htm)\n- [AAOS: Hip Strains](https://orthoinfo.aaos.org/diseases--conditions/hip-strains/)\n- [AAOS: Foot and Ankle Conditioning Program](https://orthoinfo.aaos.org/en/recovery/foot-and-ankle-conditioning-program/)\n\n---"

 {

  "title": "What Does Modifying a Workout Look Like?",
  "slug": "what-does-modifying-a-workout-look-like",

  "author": "SportPharm Editorial",

  "image": "assets/ea-spin.jpg",
  "excerpt": "“Take it easy” is vague. “Listen to your body” is useful only if you know what to change.",
  "body": "“Take it easy” is vague. “Listen to your body” is useful only if you know what to change.\n\nWorkout modification means reducing or redirecting the demand that appears to aggravate symptoms while preserving activity that remains comfortable and controlled. It is not a diagnosis or a universal rehabilitation plan. It is a practical way to stop treating every workout as all-or-nothing.\n\n## Change one variable at a time\n\nWhen possible, adjust one major variable so you can understand the response.\n\n### 1. Reduce load\n\nUse less weight, assistance, or a lighter resistance setting. A lifter might swap a heavy working set for a controlled technique session.\n\n### 2. Shorten the range of motion\n\nWork only through a comfortable range without forcing the painful portion. Do not assume a limited range is appropriate for every injury; it is simply one temporary way to lower demand.\n\n### 3. Slow down\n\nReduce running pace, cycling resistance, throwing speed, or the urgency of a circuit. Slower movement can improve control, although it may increase muscular demand in some strength exercises.\n\n### 4. Reduce impact or complexity\n\nTrade jumping for a grounded movement, running for easy cycling, or a dynamic balance exercise for a supported variation. Choose an option with a lower consequence if your control fails.\n\n### 5. Shorten the session\n\nReduce total sets, repetitions, distance, or time. Fatigue often changes technique and tolerance, so stopping earlier can matter as much as reducing intensity.\n\n## Use a three-part response check\n\nA modification is useful only if the response supports it.\n\n- **During the session:** Symptoms stay mild and stable, and mechanics remain normal.\n- **After the session:** There is no significant escalation.\n- **The next day:** You are at or near the previous baseline rather than dealing with a larger flare.\n\nIf symptoms increase at any checkpoint, reduce the demand further or stop. If even easy activity is provoking symptoms, or the pattern keeps returning, seek an assessment.\n\n## Examples for everyday athletes\n\n### Strength training\n\nReplace a painful loaded lunge with a supported split stance, a shallower comfortable range, or a different lower-body movement. Reduce weight before adding repetitions.\n\n### Running\n\nChange a speed session to a shorter walk-run on level ground, or choose comfortable low-impact conditioning. Avoid changing shoes, terrain, distance, and pace all at once.\n\n### Cycling or spin\n\nReduce resistance and time, and check whether the bike setup is contributing to the pattern. Stop if pain increases with each pedal stroke.\n\n### Court and field sports\n\nReplace full games with controlled drills that reduce cutting, acceleration, or contact. If the joint feels unstable or gives way, stop and get it assessed.\n\n### Yoga or group fitness\n\nUse props, reduce depth, and skip positions that reproduce sharp or escalating pain. Do not let the pace of the class make the decision for you.\n\n## Modification is a bridge\n\nModification can help you stay active while symptoms settle or while you arrange care. It should not become a permanent workaround for a worsening problem.\n\nSet a review point. If the same change is still necessary after a reasonable interval, symptoms are appearing earlier, or your available activity keeps shrinking, involve a qualified professional.\n\n### Bottom line\n\nModify load, range, speed, impact, complexity, or duration—and then evaluate the response. The best modification is not the one that lets you finish at any cost. It is the one that keeps movement controlled without making the pattern worse.\n\n### Continue your pathway\n\n- Need help deciding whether to train? Read **Should I Work Out When Something Hurts?**\n- Modification is not solving it? Read **Why Does the Same Pain Keep Coming Back?**\n- Ready for an assessment? Read **When Is It Time to Get an Injury Checked?**\n\n## FAQ\n\n### Is modifying a workout the same as rehabilitation?\n\nNo. Modification changes the immediate training demand. Rehabilitation is an individualized process designed to restore function and capacity, often with professional guidance.\n\n### How much should I reduce my workout?\n\nThere is no universal percentage. Reduce the demand enough that symptoms remain stable, movement remains normal, and you do not experience a meaningful flare afterward.\n\n### What if every variation still hurts?\n\nStop the aggravating activity. If pain is significant, recurring, worsening, or affecting normal function, arrange an assessment.\n\n### Editorial sources\n\n- [AAOS: Shin Splints](https://orthoinfo.aaos.org/en/diseases--conditions/shin-splints/)\n- [AAOS: Hip Strains](https://orthoinfo.aaos.org/diseases--conditions/hip-strains/)\n- [MedlinePlus: How to avoid exercise injuries](https://medlineplus.gov/ency/patientinstructions/000859.htm)\n\n---"

  "image": "assets/ea-return.jpg",
  "excerpt": "You do not need to wait until pain is unbearable to ask for help.",
  "body": "You do not need to wait until pain is unbearable to ask for help.\n\nAn assessment can be useful when you need to understand what activity is safe, why a problem keeps returning, or how to rebuild confidence. The right timing depends on how the injury happened, what symptoms are present, and how much normal function has changed.\n\n## Get emergency help now\n\nCall emergency services or go to an emergency department for:\n\n- chest pain, trouble breathing, fainting, or signs of a serious medical event;\n- an obvious deformity or a bone that has broken through the skin;\n- uncontrolled bleeding;\n- sudden loss of feeling, movement, or circulation;\n- severe weakness or inability to move;\n- a serious head, neck, or spine injury;\n- concerning symptoms after a head impact, including worsening headache, repeated vomiting, seizure, increasing confusion, slurred speech, weakness or numbness, decreased coordination, unequal pupils, or difficulty waking.\n\nWhen a possible concussion occurs in sport, the athlete should be removed immediately and should not return the same day. A healthcare provider should guide return to sport.\n\n## Arrange prompt evaluation\n\nSeek timely care when:\n\n- you cannot bear weight or use the area normally;\n- pain is severe, rapidly worsening, or associated with significant swelling or bruising;\n- a joint gives way, locks, or feels unstable;\n- you have numbness, tingling, or notable weakness;\n- pain is highly localized over a bone, occurs with ordinary walking, or appears at rest or at night;\n- symptoms follow a pop, collision, fall, or other clear injury;\n- redness, warmth, fever, or other signs of infection are present.\n\nIf you are unsure whether the situation is urgent, contact a healthcare service for triage rather than guessing.\n\n## Schedule an appointment for a persistent pattern\n\nNot every assessment is urgent. Make an appointment when pain:\n\n- does not improve with reasonable self-care;\n- keeps returning when you resume activity;\n- appears earlier or with less effort over time;\n- changes your technique, sleep, work, or daily routine;\n- has led you to rely repeatedly on pain medication;\n- leaves you uncertain about how to return safely.\n\nEarly guidance can be especially helpful if you have a history of injury, a medical condition, take multiple medicines, or are preparing for an event with a fixed deadline.\n\n## Who should you see?\n\n### Primary care\n\nA practical first stop for broad evaluation, referrals, and symptoms that may not be purely musculoskeletal.\n\n### Sports medicine\n\nUseful for exercise-related injuries, activity guidance, and coordinated return-to-sport planning.\n\n### Physical therapy\n\nOften appropriate for evaluating movement and building an individualized strength, mobility, and return-to-activity plan. Referral rules vary by location and insurance.\n\n### Athletic trainer\n\nAthletic trainers can assess sports injuries, provide immediate care, and help coordinate rehabilitation and return to participation in settings where they are available.\n\n### Pharmacist\n\nA pharmacist can review prescription medicines, over-the-counter pain relievers, topical products, supplements, duplicate ingredients, and possible interactions. They do not replace an injury examination, but they can make pain-management decisions safer.\n\n## Prepare for the appointment\n\nBring a simple symptom timeline, recent training changes, a list of medicines and supplements, prior injuries, and the specific activities you want to return to. Describe what the problem prevents you from doing—not only the number on a pain scale.\n\nUseful questions include:\n\n- What activities are safe right now?\n- What signs mean I should stop or seek more urgent care?\n- What should improve before I add load, speed, impact, or contact?\n- Could any medication or supplement affect this problem or my pain-relief options?\n\n### Bottom line\n\nGet urgent help for emergency warning signs. Arrange prompt evaluation for major loss of function, instability, neurological symptoms, severe or worsening pain, or significant trauma. For a recurring pattern, an appointment is worthwhile before the problem takes more choices away from you.\n\n### Continue your pathway\n\n- Not sure whether it is soreness? Read **Is This Normal Post-Workout Soreness?**\n- Need a plan for today? Read **Should I Work Out When Something Hurts?**\n- Want the complete pathway? Return to **Push Through or Stop?**\n\n## FAQ\n\n### How long should I wait before seeing a doctor for workout pain?\n\nThere is no single timeline. Severe symptoms, major loss of function, neurological symptoms, or significant trauma need prompt care. Pain that does not improve, keeps returning, or affects daily life also deserves evaluation.\n\n### Can a pharmacist help with a sports injury?\n\nA pharmacist can help with medication and supplement questions, duplicate ingredients, interactions, and safe pain-relief use. A pharmacist does not replace a physical injury assessment when one is needed.\n\n### Should I go to urgent care or sports medicine?\n\nUrgent care may be appropriate when timely examination or imaging may be needed and emergency signs are absent. Sports medicine may be a good fit for non-emergency exercise-related problems and return-to-activity planning. Call ahead if you are uncertain what the facility can evaluate.\n\n### Editorial sources\n\n- [CDC HEADS UP: Concussion Signs and Symptoms](https://www.cdc.gov/heads-up/signs-symptoms/index.html)\n- [CDC HEADS UP: Responding to a Sports-related Concussion](https://www.cdc.gov/heads-up/response/index.html)\n- [AAOS: Stress Fractures](https://orthoinfo.aaos.org/diseases--conditions/stress-fractures/)\n- [MedlinePlus: Muscle Aches](https://medlineplus.gov/ency/article/003178.htm)\n- [FDA: Using OTC pain relievers safely](https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/best-way-take-your-over-counter-pain-reliever-seriously-four-panel-brochure)\n\n---\n\n# Cluster-wide SEO and publishing recommendations\n\n## Internal linking\n\nEvery article should:\n\n1. Link to the **Push Through or Stop?** pillar in the opening third of the page.\n2. Link to two or three adjacent articles in context, not only in a “related posts” module.\n3. Link to the **Sports Pharmacy Explained** page where medication, supplements, or topical products are discussed.\n4. Link to **WasabiRub** only where topical pain relief is contextually relevant.\n5. End with the most appropriate next action: modify activity, read another guide, ask a pharmacist, or find professional care.\n\n## On-page structure\n\n- Use one H1 only.\n- Preserve descriptive H2s that reflect real search questions.\n- Place the direct answer within the first 100 words.\n- Add a visible “Reviewed by” line and review date.\n- Keep paragraphs short and use lists for decision criteria.\n- Add Article and Breadcrumb structured data.\n- Consider FAQ structured data only if the FAQs remain visible on the page and current search-engine guidelines support its use.\n\n## Recommended trust components\n\n- Named author and credentials\n- Named clinical and pharmacy reviewers\n- “How we review health content” page\n- Sources and last-reviewed date\n- Clear distinction between education, pharmacy services, and product promotion\n- Accessible emergency notice\n- Product claims limited to approved label language\n\n## Suggested article-card summaries\n\n1. **Is This Normal Post-Workout Soreness?**  \n   Learn how ordinary muscle soreness often behaves—and which changes mean it is time to pause.\n\n2. **Why Does the Same Pain Keep Coming Back?**  \n   Look beyond temporary relief and identify the training patterns worth changing or getting assessed.\n\n3. **Should I Work Out When Something Hurts?**  \n   Use a simple decision guide to continue, modify, stop, or seek care.\n\n4. **Why Pushing Through Isn’t a Recovery Plan**  \n   Replace the “no pain, no gain” reflex with a strategy built for consistent progress.\n\n5. **What Does Modifying a Workout Look Like?**  \n   See practical ways to adjust load, range, speed, impact, and duration.\n\n6. **When Is It Time to Get an Injury Checked?**  \n   Understand emergency signs, prompt-care signals, and which professional may be a useful starting point.\n\n## Global disclaimer\n\nThis content is for general educational purposes and is not a diagnosis or a substitute for individualized medical advice. Stop activity and seek appropriate care for severe, sudden, worsening, or otherwise concerning symptoms. In an emergency, call 911 or your local emergency number."
 }

function areaChart(data,color){
 const w=560,h=170,max=Math.max(...data),min=Math.min(...data)*0.85;
 const dx=w/(data.length-1),y=v=>h-((v-min)/(max-min||1))*(h-24)-8;
 let line='M0 '+y(data[0]).toFixed(1);data.forEach((v,i)=>{if(i)line+=' L'+(i*dx).toFixed(1)+' '+y(v).toFixed(1);});
 const area=line+` L${w} ${h} L0 ${h} Z`;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="display:block"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[0.25,0.5,0.75].map(f=>`<line x1="0" x2="${w}" y1="${(h*f).toFixed(0)}" y2="${(h*f).toFixed(0)}" stroke="#eef2f7"/>`).join('')}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${w}" cy="${y(data[data.length-1]).toFixed(1)}" r="4" fill="${color}"/></svg>`;
}

 renderTags();
 $('#tagin').onkeydown=e=>{if((e.key==='Enter'||e.key===',')&&e.target.value.trim()){e.preventDefault();const v=e.target.value.trim().replace(/,$/,'');if(v&&!draft.tags.includes(v))draft.tags.push(v);e.target.value='';renderTags();}};
 // slug auto

 $('#uploadBtn').onclick=()=>$('#fileIn').click();
 $('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{draft.image=r.result;$('#imgprev').src=r.result;$('#e_image').value='(uploaded image)';};r.readAsDataURL(f);};
 function collect(){draft.title=$('#e_title').value.trim();draft.slug=$('#e_slug').value.trim()||draft.title.toLowerCase().replace(/[^a-z0-9]+/g,'-');draft.excerpt=$('#e_excerpt').value.trim();draft.body=$('#e_body').value;draft.category=$('#e_cat').value;draft.author=$('#e_author').value.trim();draft.date=$('#e_date').value;if($('#e_image').value.indexOf('(uploaded')!==0)draft.image=$('#e_image').value.trim();}
 function persist(st){collect();if(!draft.title){toast('Add a title first');return;}draft.status=st;if(id){const i=state.articles.findIndex(x=>x.id===id);state.articles[i]=draft;}else{draft.id=uid('a');state.articles.unshift(draft);}save('articles');toast(st==='published'?'Article published':'Draft saved');location.hash='#blog';}

 $('#publishBtn').onclick=()=>persist('published');

/* ============ ANALYTICS ============ */
function viewAnalytics(V){
 const a=window.SPA?window.SPA.ensure():null;
 if(!a){V.innerHTML='<div class="pagehead"><h2 class="disp" style="font-size:30px">Store Analytics</h2></div><div class="card pad">Analytics tracker not loaded.</div>';return;}
 const P={wasabirub:{name:'WasabiRub',col:'#d6202a'},superhot:{name:'Super Hot',col:'#e25b2f'},icetrarub:{name:'WasabiRub Super Cold',col:'#2677b9'}};
 const visits=a.funnel.visits, pvw=a.funnel.productViews, atc=a.funnel.addToCart, co=a.funnel.checkout;
 const bounce=a.sessions.total?Math.round((1-a.sessions.engaged/a.sessions.total)*100):0;
 const abandon=a.cart.added?Math.round((1-a.cart.checkout/a.cart.added)*100):0;
 const conv=visits?((co/visits)*100).toFixed(1):'0.0';
 const days=Object.keys(a.daily).sort();
 const trend=days.map(d=>a.daily[d].visits); const trendData=trend.length>1?trend:[0,0];
 const funnel=[['Store visit',visits],['Viewed a product',pvw],['Added to cart',atc],['Checked out',co]];
 const fmax=funnel[0][1]||1;
 const prodRows=Object.keys(P).map(k=>({k,name:P[k].name,col:P[k].col,clicks:a.products[k].clicks,views:a.products[k].views,atc:a.products[k].addToCart}));
 const totalClicks=prodRows.reduce((s,r)=>s+r.clicks,0)||1;
 const clicks=Object.keys(a.clicks).map(k=>[k,a.clicks[k]]).sort((x,y)=>y[1]-x[1]).slice(0,8);
 const cmax=clicks.length?clicks[0][1]:1;
 const pages=Object.keys(a.pageviews).map(k=>[k,a.pageviews[k]]).sort((x,y)=>y[1]-x[1]);
 const pmax=pages.length?pages[0][1]:1;
 const kpi=(val,lbl,tr,dir)=>`<div class="kpi"><div class="k-val">${val}</div><div class="k-lbl">${lbl}</div><div class="k-trend ${dir}">${dir==='up'?'▲':'▼'} ${tr}</div></div>`;
 const prodDonut=(()=>{const r=52,c=2*Math.PI*r;let off=0;const segs=prodRows.map(rr=>{const len=c*(rr.clicks/totalClicks);const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${rr.col}" stroke-width="20" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
   return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg viewBox="0 0 140 140" width="130" height="130">${segs}<text x="70" y="65" text-anchor="middle" font-family="Bebas Neue" font-size="26" fill="#10233f">${(totalClicks/1000).toFixed(1)}k</text><text x="70" y="85" text-anchor="middle" font-size="9.5" fill="#6b7a90">product clicks</text></svg><div class="legend" style="flex-direction:column;gap:11px;margin:0">${prodRows.map(rr=>`<span><i style="background:${rr.col}"></i>${rr.name} <b style="color:var(--ink);margin-left:4px">${Math.round(rr.clicks/totalClicks*100)}%</b></span>`).join('')}</div></div>`;
 })();
 V.innerHTML=`
 <div class="pagehead"><div><h2 class="disp" style="font-size:30px">WasabiRub Store Analytics</h2><div class="sub">Product cluster · Find Your Rub, product pages &amp; How It Works · last 30 days</div></div><span class="pill p-blue"><i class="dot"></i>Live — updates as visitors browse</span></div>
 <div class="kpis">
   ${kpi(visits.toLocaleString(),'Store visits','9.4%','up')}
   ${kpi(bounce+'%','Bounce rate','2.1%','down')}
   ${kpi(atc.toLocaleString(),'Add-to-cart events','12.7%','up')}
   ${kpi(abandon+'%','Cart abandonment','1.3%','down')}
 </div>
 <div class="card" style="margin-bottom:16px"><div class="sec-h"><h3>Store traffic · daily visits</h3><span class="pill p-green"><i class="dot"></i>${conv}% visit → checkout</span></div><div class="pad">${areaChart(trendData,'#d6202a')}</div></div>
 <div class="grid2">
   <div class="card"><div class="sec-h"><h3>Conversion funnel</h3></div><div class="pad">${funnel.map((f,i)=>{const pct=Math.max(4,Math.round(f[1]/fmax*100));const drop=i?(100-Math.round(f[1]/(funnel[i-1][1]||1)*100)):0;return `<div class="funnel-row"><div class="funnel-lbl"><span>${f[0]}</span><b>${f[1].toLocaleString()}</b></div><div class="funnel-bar"><i style="width:${pct}%"></i></div>${i?`<div class="funnel-drop">▼ ${drop}% drop-off from “${funnel[i-1][0]}”</div>`:''}</div>`;}).join('')}</div></div>
   <div class="card"><div class="sec-h"><h3>Product interest share</h3></div><div class="pad">${prodDonut}</div></div>
 </div>
 <div class="grid2" style="margin-top:16px">
   <div class="card"><div class="sec-h"><h3>WasabiRub vs Super Hot vs WasabiRub Super Cold</h3><span class="t-sub">by clicks</span></div><div class="pad"><div class="barlist">${prodRows.map(r=>`<div class="barrow"><span class="t-sub" style="color:var(--ink);font-weight:700"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${r.col};margin-right:8px;vertical-align:middle"></i>${r.name}</span><div class="track"><i style="width:${Math.round(r.clicks/totalClicks*100)}%;background:linear-gradient(90deg,${r.col}88,${r.col})"></i></div><span class="num">${r.clicks.toLocaleString()}</span></div>`).join('')}</div>
     <div class="prod-atc">${prodRows.map(r=>`<div><b style="color:${r.col}">${r.atc.toLocaleString()}</b><span>${r.name}<br>add-to-cart</span></div>`).join('')}</div></div></div>
   <div class="card"><div class="sec-h"><h3>Most-clicked elements</h3></div><div class="pad"><div class="barlist">${clicks.map(([n,v])=>`<div class="barrow"><span class="t-sub" style="color:var(--ink);font-weight:600">${esc(n)}</span><div class="track"><i style="width:${Math.round(v/cmax*100)}%"></i></div><span class="num">${v.toLocaleString()}</span></div>`).join('')}</div></div></div>
 </div>
 <div class="grid2" style="margin-top:16px">
   <div class="card"><div class="sec-h"><h3>Pages in the store cluster</h3></div><div class="pad"><div class="barlist">${pages.map(([n,v])=>`<div class="barrow"><span class="t-sub" style="color:var(--ink);font-weight:600">${esc(n)}</span><div class="track"><i style="width:${Math.round(v/pmax*100)}%"></i></div><span class="num">${v.toLocaleString()}</span></div>`).join('')}</div></div></div>
   <div class="card"><div class="sec-h"><h3>Cart</h3><span class="t-sub">mock checkout</span></div><div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;align-items:center">
     <div><div class="disp" style="font-size:36px">${a.cart.added.toLocaleString()}</div><div class="t-sub">Carts started</div></div>
     <div><div class="disp" style="font-size:36px;color:var(--green)">${a.cart.checkout.toLocaleString()}</div><div class="t-sub">Checked out</div></div>
     <div><div class="disp" style="font-size:36px;color:var(--red)">${(a.cart.added-a.cart.checkout).toLocaleString()}</div><div class="t-sub">Abandoned</div></div>
   </div></div>
 </div>
 <p class="t-sub" style="margin:16px 2px 0">Prototype: events are captured in this browser (localStorage) with a seeded 30-day baseline. In production this maps onto a real analytics pipeline. Browse the store, then return here — the numbers move.</p>`;
}

function bindGo(scope){scope.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-del-article],[data-del-prod],[data-edit-prod]'))return;location.hash='#'+el.dataset.go;});}

/* ============ BOOT ============ */
$('#loginForm').onsubmit=e=>{e.preventDefault();sessionStorage.setItem('sp_admin_auth','1');$('#login').style.display='none';$('#app').hidden=false;if(!location.hash)location.hash='#dashboard';router();};
$('#logout').onclick=()=>{sessionStorage.removeItem('sp_admin_auth');location.reload();};
$('#globalsearch').oninput=e=>{const v=e.target.value.trim();if(v.length>1&&!location.hash.startsWith('#blog/')){blogFilter.q=v.toLowerCase();location.hash='#blog';}};
window.addEventListener('hashchange',router);
if(sessionStorage.getItem('sp_admin_auth')){$('#login').style.display='none';$('#app').hidden=false;if(!location.hash)location.hash='#dashboard';router();}
</script>
